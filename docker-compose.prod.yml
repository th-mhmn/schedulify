services:
  app:
    image: ghcr.io/th-mhmn/schedulify:${IMAGE_TAG:-latest}
    container_name: schedulify-app
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/src/main.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - schedulify-net

  postgres:
    image: postgres:17-alpine
    container_name: schedulify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schedulify-net

  redis:
    image: redis:7-alpine
    container_name: schedulify-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schedulify-net

volumes:
  postgres-data:
  redis-data:

networks:
  schedulify-net:
    driver: bridge