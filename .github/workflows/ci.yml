name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder pnpm prisma generate

      - name: Create test environment
        run: |
          printf '%s' '${{ secrets.TEST_SECRETS }}' > .env.test

      - name: Create E2E environment
        run: |
          printf '%s' '${{ secrets.ENV_E2E }}' > .env.e2e

      - name: Debug test infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs

      - name: Start test infrastructure
        run: pnpm test:db:start

      - name: Run integration tests
        run: pnpm test:int

      - name: Run E2E migrations
        run: pnpm prisma:e2e:deploy

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down
