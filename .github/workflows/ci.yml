name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder pnpm prisma generate

      - name: Create integration test environment
        run: |
          printf '%s' '${{ secrets.TEST_SECRETS }}' > .env.test

      - name: Create E2E test environment
        run: |
          printf '%s' '${{ secrets.ENV_E2E }}' > .env.e2e

      - name: Start test infrastructure
        run: pnpm test:db:start

      - name: Run integration database migrations
        run: pnpm prisma:test:deploy

      - name: Run integration tests
        run: pnpm test:int

      - name: Run e2e database migrations
        run: pnpm prisma:test:e2e:deploy

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down
  docker:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
